name: Publicar Radar SECOP en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "secop_radar/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: secop_radar/site
      - id: despliegue
        uses: actions/deploy-pages@v4
